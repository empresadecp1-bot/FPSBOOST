<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Otimização - Boost</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans flex items-center justify-center h-screen">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-96 text-center">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">
            Optimizer Hub
        </h1>
        <p class="text-slate-400 text-sm mb-6">Painel 100% Seguro de Otimização</p>

        <!-- Botão com Animação -->
        <button onclick="executarBoost()" id="boostBtn" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all duration-300 transform active:scale-95 shadow-lg shadow-cyan-500/20">
            Executar Boost Geral
        </button>

        <!-- Status -->
        <div id="status" class="mt-4 text-xs text-slate-500">Sistema pronto para otimizar.</div>
    </div>

    <script>
        function executarBoost() {
            const btn = document.getElementById('boostBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.innerText = "Otimizando registros e limpando temporários...";
            status.className = "mt-4 text-xs text-cyan-400";

            setTimeout(() => {
                status.innerText = "Boost concluído com sucesso! 🚀";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 2500);
        }
    </script>

</body>
</html>
