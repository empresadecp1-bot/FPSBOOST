<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers • WebGL Engine Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 1000px;
        }

        .domain-tag {
            font-size: 0.75rem;
            color: #45f3ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(69, 243, 255, 0.4);
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            gap: 12px;
        }

        .viewport-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(69, 243, 255, 0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .control-panel {
            background: #12141d;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #a0aab5;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }

        .map-card {
            background: #1a1d29;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-card:hover {
            border-color: #45f3ff;
            background: #232738;
            transform: translateY(-1px);
        }

        .map-card.active {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            border-color: #45f3ff;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
        }

        .mod-hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #12141d;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .hud-item {
            font-size: 0.75rem;
            color: #2ed573;
            font-weight: bold;
            background: rgba(46, 213, 115, 0.05);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid rgba(46, 213, 115, 0.1);
        }

        @media (max-width: 600px) {
            .mod-hud {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="domain-tag">WebGL Experiência • tavvkkj.xyz</div>
        <h1>Subway Surfers Core Engine</h1>
    </header>

    <div class="container">
        
        <!-- Status Painel Mod -->
        <div class="mod-hud">
            <div class="hud-item">🪙 Moedas: ∞</div>
            <div class="hud-item">🔑 Chaves: ∞</div>
            <div class="hud-item">👤 Skins: Desbloqueadas</div>
            <div class="hud-item">🚫 Engine: Ad-Free</div>
        </div>

        <!-- Visualizador WebGL (Viewport Principal) -->
        <div class="viewport-container">
            <iframe id="webglFrame" src="https://html5.gamemonetize.com/co8897z7fgg9197pfdk9w0440h6n6b1w/" allowfullscreen></iframe>
        </div>

        <!-- Seletor de Instâncias WebGL / Mapas -->
        <div class="control-panel">
            <div class="panel-title">
                <span>Seletor de Mapas & Instâncias WebGL</span>
                <span class="status-pill">● Online & Estável</span>
            </div>
            
            <div class="map-grid">
                <button class="map-card active" onclick="mudarInstancia(this, 'https://html5.gamemonetize.com/co8897z7fgg9197pfdk9w0440h6n6b1w/')">
                    🚇 <span>Original Core</span>
                </button>
                <button class="map-card" onclick="mudarInstancia(this, 'https://games.poki.com/poki-iframe.html?game=subway-surfers')">
                    🌆 <span>World Tour Engine</span>
                </button>
                <button class="map-card" onclick="mudarInstancia(this, 'https://html5.gamedistribution.com/rvvASMiM/c9327ee98d404d72ba6f839537f5d6f8/')">
                    🏝️ <span>Havana WebGL</span>
                </button>
                <button class="map-card" onclick="mudarInstancia(this, 'https://games.poki.com/poki-iframe.html?game=subway-surfers-venice')">
                    🏖️ <span>Veneza Map</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        function mudarInstancia(elemento, urlMapa) {
            const iframe = document.getElementById('webglFrame');
            
            // Gerencia os estados visuais dos botões
            document.querySelectorAll('.map-card').forEach(card => card.classList.remove('active'));
            elemento.classList.add('active');

            // Troca limpa de contexto WebGL sem recarregar a página inteira
            iframe.style.opacity = '0';
            setTimeout(() => {
                iframe.src = urlMapa;
                iframe.style.opacity = '1';
            }, 150);
        }
    </script>

</body>
</html>
