<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Otimização - Boost</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center relative bg-cover bg-center bg-no-repeat overflow-hidden" style="background-image: url('fundo.jpg');">

    <!-- Camada escura por cima da imagem -->
    <div class="absolute inset-0 bg-slate-950/85 backdrop-blur-[3px] z-0"></div>

    <!-- Tela de Login com Senha -->
    <div id="loginModal" class="absolute inset-0 bg-slate-950/95 flex items-center justify-center z-50">
        <div class="bg-slate-900/95 border border-slate-800 p-8 rounded-2xl shadow-2xl w-[450px] text-center backdrop-blur-md mx-4">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">
                Acesso Restrito
            </h1>
            <p class="text-slate-400 text-sm mb-6">Digite a senha para acessar o painel</p>

            <input type="password" id="senhaInput" placeholder="Digite a senha..." class="w-full px-4 py-3 mb-4 bg-slate-950 border border-slate-800 rounded-xl text-white text-center focus:outline-none focus:border-cyan-500 transition-colors">
            
            <button onclick="verificarSenha()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all duration-300 transform active:scale-95 shadow-lg shadow-cyan-500/25">
                Entrar
            </button>

            <div id="erroSenha" class="mt-4 text-xs text-red-500 hidden">Senha incorreta! Tente novamente.</div>
        </div>
    </div>

    <!-- Painel de Otimização Esticado (Inicia Oculto) -->
    <div id="painelHub" class="bg-slate-900/90 border border-slate-800 p-10 rounded-3xl shadow-2xl w-[600px] text-center backdrop-blur-md relative z-10 mx-4 hidden">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-1">
            Optimizer Hub Pro
        </h1>
        <p class="text-slate-400 text-sm mb-8">Painel de Desempenho e Periféricos</p>

        <!-- Botões Esticados -->
        <div class="space-y-4">
            <button onclick="executarFuncao('fps', this)" class="w-full py-4 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-bold rounded-2xl transition-all text-base shadow-lg flex items-center justify-center gap-3">
                🚀 Aumentar FPS (Prioridade Máxima)
            </button>

            <button onclick="executarFuncao('teclado', this)" class="w-full py-4 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-bold rounded-2xl transition-all text-base shadow-lg flex items-center justify-center gap-3">
                ⌨️ Boost do Teclado (Zerar Delay)
            </button>

            <button onclick="executarFuncao('mouse', this)" class="w-full py-4 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-bold rounded-2xl transition-all text-base shadow-lg flex items-center justify-center gap-3">
                🖱️ Boost do Mouse (Ajustar Polling/Sensibilidade)
            </button>

            <button onclick="executarFuncao('geral', this)" class="w-full py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl transition-all transform active:scale-95 shadow-xl shadow-cyan-500/25 text-base flex items-center justify-center gap-3 mt-2">
                ⚡ Executar Boost Completo
            </button>
        </div>

        <!-- Status -->
        <div id="status" class="mt-6 text-sm text-slate-400 font-medium min-h-[24px]">Sistema pronto para otimizar.</div>
    </div>

    <script>
        function verificarSenha() {
            const senhaDigitada = document.getElementById('senhaInput').value;
            const loginModal = document.getElementById('loginModal');
            const painelHub = document.getElementById('painelHub');
            const erroSenha = document.getElementById('erroSenha');

            if (senhaDigitada === 'FPS') {
                loginModal.classList.add('hidden');
                painelHub.classList.remove('hidden');
            } else {
                erroSenha.classList.remove('hidden');
                document.getElementById('senhaInput').value = '';
            }
        }

        function executarFuncao(tipo, botao) {
            const status = document.getElementById('status');
            let msgInicio = "";
            let msgFim = "";

            if (tipo === 'fps') {
                msgInicio = "Otimizando FPS e registro do sistema...";
                msgFim = "FPS Aumentado com sucesso! 🚀";
            } else if (tipo === 'teclado') {
                msgInicio = "Aplicando boost e zerando delay do teclado...";
                msgFim = "Boost do Teclado aplicado! ⌨️";
            } else if (tipo === 'mouse') {
                msgInicio = "Ajustando Polling Rate e sensor do mouse...";
                msgFim = "Boost do Mouse aplicado com sucesso! 🖱️";
            } else if (tipo === 'geral') {
                msgInicio = "Executando limpeza profunda e boost completo...";
                msgFim = "Boost Completo finalizado com sucesso! 🔥";
            }

            botao.disabled = true;
            botao.classList.add('opacity-50', 'cursor-not-allowed');
            status.innerText = msgInicio;
            status.className = "mt-6 text-sm text-cyan-400 font-medium min-h-[24px] animate-pulse";

            setTimeout(() => {
                status.innerText = msgFim;
                status.className = "mt-6 text-sm text-emerald-400 font-medium min-h-[24px]";
                botao.disabled = false;
                botao.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 2500);
        }
    </script>

</body>
</html>
