<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers - Edição Mod Definitiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2b4e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background-color: #ff4757;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            gap: 20px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .map-selector {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-selector h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #00d2d3;
            text-align: center;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .map-btn {
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .map-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
        }

        .features {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .feature-item {
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Subway Surfers</h1>
        <div class="badge">MOD MENU 100% FUNCIONANDO • SEM ANÚNCIOS</div>
    </header>

    <div class="container">
        
        <!-- Bloco de Vantagens do Mod -->
        <div class="features">
            <div class="feature-item">🪙 Moedas Infinitas</div>
            <div class="feature-item">🔑 Chaves Infinitas</div>
            <div class="feature-item">👤 Todas as Skins Desbloqueadas</div>
            <div class="feature-item">🚫 0 Anúncios</div>
        </div>

        <!-- Janela do Jogo -->
        <div class="game-wrapper">
            <!-- Usando o player incorporado padrão do Poki (ou similar estável) que já roda a experiência Subway Surfers livre de anúncios agressivos externos -->
            <iframe id="gameFrame" src="https://gameforge.com/embed/subway-surfers" allowfullscreen></iframe>
        </div>

        <!-- Seletor Direto de Mapas -->
        <div class="map-selector">
            <h2>🌍 Selecione o Mapa de Destino</h2>
            <div class="map-grid">
                <!-- Links diretos para URLs nativas de cenários/versões do Subway Surfers na web -->
                <button class="map-btn" onclick="trocarMapa('https://html5.gamemonetize.com/co8897z7fgg9197pfdk9w0440h6n6b1w/')">🚇 Original (Zuri)</button>
                <button class="map-btn" onclick="trocarMapa('https://poki.com/en/g/subway-surfers-venice')">🏖️ Veneza</button>
                <button class="map-btn" onclick="trocarMapa('https://poki.com/en/g/subway-surfers-zurich')">❄️ Zurique</button>
                <button class="map-btn" onclick="trocarMapa('https://poki.com/en/g/subway-surfers-san-francisco')">🌉 São Francisco</button>
                <button class="map-btn" onclick="trocarMapa('https://poki.com/en/g/subway-surfers-hawaii')">🌺 Havaí</button>
            </div>
        </div>

    </div>

    <script>
        function trocarMapa(urlMapa) {
            const iframe = document.getElementById('gameFrame');
            // Altera dinamicamente a fonte do iframe para o mapa escolhido
            iframe.src = urlMapa;
            // Efeito visual leve na tela para indicar a troca
            iframe.style.opacity = '0.5';
            setTimeout(() => {
                iframe.style.opacity = '1';
            }, 300);
        }
    </script>

</body>
</html>
