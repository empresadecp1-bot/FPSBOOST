<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página HTML Moderna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        #mensagem {
            margin-top: 20px;
            font-weight: 500;
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, Mundo! 🚀</h1>
        <p>Este é um arquivo HTML completo, estilizado com CSS embutido e interativo com JavaScript. Salve este código como <strong>index.html</strong> e abra no seu navegador.</p>
        <button class="btn" onclick="clicarBotao()">Clique em Mim</button>
        <p id="mensagem"></p>
    </div>

    <script>
        function clicarBotao() {
            const mensagem = document.getElementById("mensagem");
            mensagem.textContent = "Parabéns! O seu código HTML e JavaScript está funcionando perfeitamente.";
        }
    </script>

</body>
</html>
