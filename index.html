<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Otimização - Boost</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans flex items-center justify-center h-screen">

    <!-- Tela de Login / Senha -->
    <div id="loginModal" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-96 text-center">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">
            Acesso Restrito
        </h1>
        <p class="text-slate-400 text-sm mb-6">Digite a senha para acessar o painel</p>

        <input type="password" id="senhaInput" placeholder="Digite a senha..." class="w-full px-4 py-3 mb-4 bg-slate-950 border border-slate-800 rounded-xl text-white text-center focus:outline-none focus:border-cyan-500 transition-colors">
        
        <button onclick="verificarSenha()" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all duration-300 transform active:scale-95 shadow-lg shadow-cyan-500/20">
            Entrar
        </button>

        <div id="erroSenha" class="mt-4 text-xs text-red-500 hidden">Senha incorreta! Tente novamente.</div>
    </div>

    <!-- Painel de Otimização (Inicia Oculto) -->
    <div id="painelHub" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-96 text-center hidden">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">
            Optimizer Hub
        </h1>
        <p class="text-slate-400 text-sm mb-6">Painel 100% Seguro de Otimização</p>

        <!-- Botão com Animação -->
        <button onclick="executarBoost()" id="boostBtn" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-all duration-300 transform active:scale-95 shadow-lg shadow-cyan-500/20">
            Executar Boost Geral
        </button>

        <!-- Status -->
        <div id="status" class="mt-4 text-xs text-slate-500">Sistema pronto para otimizar.</div>
    </div>

    <script>
        function verificarSenha() {
            const senhaDigitada = document.getElementById('senhaInput').value;
            const loginModal = document.getElementById('loginModal');
            const painelHub = document.getElementById('painelHub');
            const erroSenha = document.getElementById('erroSenha');

            // Senha configurada como "FPS"
            if (senhaDigitada === 'FPS') {
                loginModal.classList.add('hidden');
                painelHub.classList.remove('hidden');
            } else {
                erroSenha.classList.remove('hidden');
                document.getElementById('senhaInput').value = '';
            }
        }

        function executarBoost() {
            const btn = document.getElementById('boostBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.innerText = "Otimizando registros e limpando temporários...";
            status.className = "mt-4 text-xs text-cyan-400";

            setTimeout(() => {
                status.innerText = "Boost concluído com sucesso! 🚀";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 2500);
        }
    </script>

</body>
</html>
